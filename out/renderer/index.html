<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-eval' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https: sanshiman:;
        media-src 'self' data: blob: https: sanshiman:;
        connect-src 'self' https: wss: blob: data:;
        font-src 'self' data:;
      "
    />
    <title>叁视漫</title>

    <!-- 字体：使用系统字体栈，避免依赖 CDN（Electron 常离线使用） -->
    <script type="module" crossorigin src="./assets/index-BujjGe6O.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vendor-zustand-VeFn8IKR.js">
    <link rel="modulepreload" crossorigin href="./assets/vendor-flow-DdC3WT5u.js">
    <link rel="modulepreload" crossorigin href="./assets/vendor-icons-DmAdBLBT.js">
    <link rel="modulepreload" crossorigin href="./assets/vendor-marked-D9eDbhZJ.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CD2bkXOj.css">
    <link rel="stylesheet" href="./assets/progress-hud.css">
    <link rel="stylesheet" href="./assets/ui-upgrades.css">
    <link rel="stylesheet" href="./assets/missing-image.css">
    <link rel="stylesheet" href="./assets/asset-viewer.css">
    <!-- 强制暗色主题 + ReactFlow 画布透明，露出 starfield canvas -->
    <style>
      /* 开屏毛笔字体：HYShangWeiShouShuW（华艺尚伟手书W）*/
      @font-face {
        font-family: 'HYShangWeiShouShuW';
        src: url('./assets/HYShangWeiShouShuW.woff2') format('woff2'),
             url('./assets/HYShangWeiShouShuW.ttf') format('truetype');
        font-display: swap;
      }
      :root, .theme-light, .theme-dark, html, body, #root {
        --bg-base: #09090b !important;
        --bg-panel: #18181b !important;
        --bg-secondary: #18181b !important;
        --text-primary: #f4f4f5 !important;
        --text-secondary: #a1a1aa !important;
        --text-muted: #71717a !important;
        --border-color: #ffffff1a !important;
        background-color: #020308 !important;
        background: #020308 !important;
      }
      .react-flow,
      .react-flow__background,
      .react-flow__renderer,
      .react-flow__viewport,
      .react-flow__pane {
        background: transparent !important;
        background-color: transparent !important;
      }
      /* 节点本体实色 + 边框 + 阴影，让节点在深色画布上清晰可见 */
      .react-flow__node {
        background-color: #1f2640 !important;
        background: #1f2640 !important;
        border-radius: 12px;
        border: 1px solid rgba(140, 180, 230, 0.18) !important;
        box-shadow: 0 6px 28px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.4);
        /* 局部覆盖 CSS 变量，让节点内 inline style 用的 var(--bg-secondary)/var(--bg-panel) 都解析成节点专属实色 */
        --bg-panel: #1f2640 !important;
        --bg-secondary: #1f2640 !important;
        --bg-base: #1f2640 !important;
      }
      /* 内层根节点统一实色，覆盖 var(--bg-panel) / Tailwind 半透明 */
      .react-flow__node > div,
      .react-flow__node > div > div,
      .node-wrapper {
        background-color: #1f2640 !important;
        background: #1f2640 !important;
      }
      /* 关闭节点内的背景虚化 — 在实色底上没意义，反而加重"糊"感 */
      .react-flow__node,
      .react-flow__node *[style*="backdrop"],
      .react-flow__node *[style*="filter"] {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      .react-flow {
        --xy-background-color: transparent !important;
        --xy-background-color-default: transparent !important;
      }
      /* 强制所有可编辑区域实色暗背景 — 无视 Tailwind 透明类 */
      textarea,
      textarea.nodrag,
      textarea.nowheel,
      input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]),
      select,
      [contenteditable="true"],
      [contentEditable="true"],
      .nodrag.nowheel {
        background-color: #1e2127 !important;
        background: #1e2127 !important;
        color: #c0c4c8 !important;
        --tw-bg-opacity: 1 !important;
      }
      textarea:focus,
      input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]):focus,
      select:focus,
      [contenteditable="true"]:focus,
      [contentEditable="true"]:focus,
      .nodrag.nowheel:focus {
        background-color: #24272e !important;
        background: #24272e !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script src="./assets/progress-hud.js"></script>
    <script src="./assets/wheel-scroll-fix.js"></script>
    <script src="./assets/starfield-bg.js"></script>
    <script src="./assets/missing-image.js"></script>
    <script src="./assets/asset-viewer.js"></script>
    <script src="./assets/gen-node-editor-fix.js"></script>
    <script>
      window.onerror = function (message, source, lineno, colno, error) {
        var root = document.getElementById('root')
        if (!root) return
        var detail = String(message || '未知错误') + '\n' + String(source || '') + ':' + String(lineno || 0) + ':' + String(colno || 0)
        var safe = function (v) {
          return String(v || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;')
        }
        root.innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;background:radial-gradient(ellipse 70% 55% at 50% 35%,rgba(95,214,255,.10),transparent 62%),#020308;color:#f4f1e8;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei UI,sans-serif;">' +
            '<section style="width:min(720px,calc(100vw - 48px));border:1px solid rgba(180,205,255,.16);border-radius:18px;background:linear-gradient(145deg,rgba(16,19,29,.96),rgba(8,11,20,.96));box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px rgba(214,168,90,.08),0 0 42px rgba(95,214,255,.10);overflow:hidden;">' +
              '<div style="height:2px;background:linear-gradient(90deg,transparent,#d6a85a,#c94b45,#5fd6ff,transparent);"></div>' +
              '<div style="padding:26px 28px 28px;">' +
                '<div style="display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,107,107,.24);background:rgba(60,18,22,.34);color:#ffb0a8;font-size:12px;">朱砂警示</div>' +
                '<h1 style="margin:0 0 8px;font-size:28px;letter-spacing:.04em;color:#f4f1e8;">界面加载失败</h1>' +
                '<p style="margin:0 0 18px;color:#b8bfd4;line-height:1.7;">叁视漫灵卷界面遇到渲染异常。请截图或复制下面的信息，重启应用后如果仍出现，再查看日志目录。</p>' +
                '<pre style="white-space:pre-wrap;word-break:break-word;margin:0;padding:14px 16px;border-radius:12px;border:1px solid rgba(180,205,255,.13);background:rgba(2,3,8,.54);color:#ffd0c8;font-size:12px;line-height:1.6;">' + safe(detail) + '</pre>' +
              '</div>' +
            '</section>' +
          '</div>'
        try { console.error('[renderer-fallback]', detail, error) } catch (_) {}
      }
    </script>
  </body>
</html>
